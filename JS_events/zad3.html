<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Kalkulator</h2>

    <input type="number" id="broj1" placeholder="Prvi broj">
    
    <input type="number" id="broj2" placeholder="Drugi broj">

    <select id="operacija">
        <option value="zbroji">Zbrajanje</option>
        <option value="oduzmi">Oduzimanje</option>
        <option value="pomnozi">Množenje</option>
        <option value="podijeli">Dijeljenje</option>
    </select>

    <button id="izracunaj">Izračunaj</button>

    <p id="rezultat"></p>


    <script>
        
// Funkcije za matematičke operacije

function zbroji(a, b) {
    return a + b;
}

function oduzmi(a, b) {
    return a - b;
}

function pomnozi(a, b) {
    return a * b;
}

function podijeli(a, b) {
    if (b == 0) {
        return "Nije moguće dijeliti s nulom!";
    }
    return a / b;
}


// Funkcija koja prima callback
function izvrsi(a, b, operacija) {
    return operacija(a, b);
}


// EventListener za gumb
document.getElementById("izracunaj").addEventListener("click", function() {

    let a = Number(document.getElementById("broj1").value);
    let b = Number(document.getElementById("broj2").value);

    let izbor = document.getElementById("operacija").value;

    let rezultat;

    if (document.getElementById("broj1").value == "" ||
        document.getElementById("broj2").value == "") {

        rezultat = "Unesite oba broja!";

    } else {

        if (izbor == "zbroji") {
            rezultat = izvrsi(a, b, zbroji);
        }
        else if (izbor == "oduzmi") {
            rezultat = izvrsi(a, b, oduzmi);
        }
        else if (izbor == "pomnozi") {
            rezultat = izvrsi(a, b, pomnozi);
        }
        else if (izbor == "podijeli") {
            rezultat = izvrsi(a, b, podijeli);
        }
    }

    document.getElementById("rezultat").innerHTML ="Rezultat odabrane operacije: " + rezultat;

});

    </script>
</body>
</html>

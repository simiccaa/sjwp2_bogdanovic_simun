<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text">
    <h1></h1>
    <h2></h2>
    <script>

        const text = document.querySelector("input");
        const poruka = document.querySelector("h1");
        const tipka = document.querySelector("h2");

        text.addEventListener("keydown", function (event) {
            tipka.textContent = "Pritisnuta tipka: " + event.key;
            if(event.key === "Enter"){
                poruka.textContent = "Potvrđeno!";    
            }
            if(event.key === "Escape"){
                poruka.textContent = "";
                tipka.textContent = "";
            }
        });
        
        
    
    </script>
</body>
</html>

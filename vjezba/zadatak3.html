<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zadatak 3</title>
</head>
<body>
  <canvas
      id="myCanvas"
      width="600"
      height="600"
      style="border: 1px solid black"
    ></canvas>
    <script>
      let c = document.getElementById("myCanvas");
      let ctx = c.getContext("2d");

      ctx.beginPath();
      ctx.arc(270, 350, 100, 0, 2 * Math.PI);
      ctx.fillStyle = "red";
      ctx.fill();

      

      ctx.beginPath();
      ctx.arc(269, 217, 15, 0, 2 * Math.PI);
      ctx.fillStyle = "orange";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(269, 217, 12, 0, 2 * Math.PI);
      ctx.fillStyle = "white";
      ctx.fill();


      ctx.beginPath();
      ctx.rect(249, 230, 40, 25);
      ctx.fillStyle = "orange";
      ctx.fill();

    </script>
  
</body>
</html>
